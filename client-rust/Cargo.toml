[package]
name = "chat-udp-tcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cliente de chat estilo WhatsApp sobre TCP y UDP"

[dependencies]
eframe = "0.29"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
strip = true
